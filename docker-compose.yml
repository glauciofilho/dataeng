version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
    # Pass infra vars into Airflow
    S3_ENDPOINT: ${S3_ENDPOINT}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_REGION: ${S3_REGION:-us-east-1}
    SPARK_MASTER_URL: ${SPARK_MASTER_URL}
    ICEBERG_REST_URL: ${ICEBERG_REST_URL}
    TRINO_HOST: ${TRINO_HOST}
    TRINO_PORT: ${TRINO_PORT}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./spark/jobs:/opt/spark/jobs   # jobs accessible from Airflow too
    - ./dbt:/opt/airflow/dbt         # dbt project accessible by BashOperator
  deploy:
    resources:
      limits:
        memory: 1g

services:

  # ─── Iceberg REST Catalog ─────────────────────────────────────
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION:-us-east-1}
      CATALOG_WAREHOUSE: ${S3_WAREHOUSE_PATH:-s3a://warehouse/}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${S3_ENDPOINT}
      CATALOG_S3_PATH__STYLE__ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── Airflow Init ─────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@example.com
          --password admin
      "
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── Airflow Webserver ───────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  # ─── Airflow Scheduler ───────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── Spark Master ────────────────────────────────────────────
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-master
    env_file: .env
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      ICEBERG_REST_URL: ${ICEBERG_REST_URL}
    ports:
      - "8090:8080"
      - "7077:7077"
    deploy:
      resources:
        limits:
          memory: 512m

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-worker
    env_file: .env
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 2
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      ICEBERG_REST_URL: ${ICEBERG_REST_URL}
    ports:
      - "8091:8081"
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/spark/jobs
    deploy:
      resources:
        limits:
          memory: 1536m

  # ─── Trino ───────────────────────────────────────────────────
  trino:
    image: trinodb/trino:446
    container_name: trino
    env_file: .env
    ports:
      - "8083:8080"
    volumes:
      - ./trino/etc:/etc/trino
    deploy:
      resources:
        limits:
          memory: 1536m
    depends_on:
      iceberg-rest:
        condition: service_started

volumes:
  airflow_logs:

networks:
  default:
    name: dataeng-network
